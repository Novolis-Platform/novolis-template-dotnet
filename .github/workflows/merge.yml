name: Merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Template repository has no solution
        run: |
          echo "novolis-template-dotnet is the repository skeleton."
          echo "Generated repositories run dotnet-merge-publish. This checkout has no project to restore."
